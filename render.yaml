services:
  - type: web
    name: laundry-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: laundry
      - key: JWT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_PHONE
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_PROVIDER
        value: stub
      - key: ACCESS_TOKEN_MINUTES
        value: "480"
      - key: REMINDER_AFTER_DAYS
        value: "2"
      - key: REMINDER_SCAN_MINUTES
        value: "60"
      - key: TIMEZONE
        value: Asia/Kolkata
